{% extends 'store/base.html' %}
{% block content %}
<div style="background:white; padding:30px; border-radius:8px; max-width:400px; margin:auto;">
    <h2 style="margin-bottom:20px;">Login</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%; margin-top:15px;">Login</button>
    </form>
    <p style="margin-top:15px;">No account? <a href="/register/">Register</a></p>
</div>
{% endblock %}
