<!DOCTYPE html>
<html>
<head>
    <title>CodeAlpha Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #333; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 15px; }
        nav .logo { color: white; font-size: 20px; font-weight: bold; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .btn { background: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; text-decoration: none; display: inline-block; border-radius: 5px; }
        .btn:hover { background: #555; }
    </style>
</head>
<body>
    <nav>
        <span class="logo">🛒 CodeAlpha Store</span>
        <div>
            <a href="/">Home</a>
            <a href="/cart/">Cart</a>
            {% if user.is_authenticated %}
                <a href="/logout/">Logout ({{ user.username }})</a>
            {% else %}
                <a href="/login/">Login</a>
                <a href="/register/">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
