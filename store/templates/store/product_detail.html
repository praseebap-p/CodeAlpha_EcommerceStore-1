{% extends 'store/base.html' %}
{% block content %}
<div style="background:white; padding:30px; border-radius:8px;">
    {% if product.image %}
        <img src="{{ product.image.url }}" style="width:300px; border-radius:8px;">
    {% endif %}
    <h2 style="margin:20px 0;">{{ product.name }}</h2>
    <p style="color:#666; margin-bottom:15px;">{{ product.description }}</p>
    <p style="font-size:24px; font-weight:bold; margin-bottom:20px;">${{ product.price }}</p>
    <p>In Stock: {{ product.stock }}</p>
    <a href="/add-to-cart/{{ product.pk }}/" class="btn" style="margin-top:15px;">Add to Cart 🛒</a>
</div>
{% endblock %}
